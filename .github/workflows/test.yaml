# CI of this repository on both architectures, then workflow-check over its
# jobs, whose check / required is the required check (FY-0034). Weekly,
# because runner image updates can break the image's tests without a change
# here, and to rebuild the newest release (FY-0032).
name: test

on:
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: the title check
  push:
    branches: [main, "release/v*"]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  # A title or description edit must not cancel a long run.
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
        && github.event.action != 'edited' }}

jobs:
  image:
    name: Image on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: flakeyard/action-setup-nix@d9d2d2c4ab70b7829a12d6ad04bc9c1b350a9669 # v0.1.3
      # Before any evaluation of the flake (FY-0017).
      - name: Check flake.lock
        uses: flakeyard/action-flake-lock@22ec9e6fc587bc94ecc81057c9f5a0e198c54efa # v0.1.0
      # First, while Nix still knows which derivations it builds itself.
      - name: Check reproducibility
        shell: bash
        run: nix run --no-update-lock-file .#check-reproducible
      - name: Check the size
        shell: bash
        run: nix run --no-update-lock-file .#check-size -- size-budget
      - name: Check the flake
        shell: bash
        run: nix flake check --no-update-lock-file --print-build-logs
      - name: Smoke tests
        shell: bash
        run: nix run --no-update-lock-file .#smoke -- tests/smoke

  licenses:
    name: Licenses on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: flakeyard/action-setup-nix@d9d2d2c4ab70b7829a12d6ad04bc9c1b350a9669 # v0.1.3
      - name: Generate the SBOM and check the licenses
        shell: bash
        run: nix run --no-update-lock-file .#check-licenses -- "$RUNNER_TEMP/sbom.cdx.json"

  # Weekly only: it depends on the registry, so other events skip it. No name,
  # so that caller-may-skip matches the job id (workflow-check ADR-0003).
  rebuild:
    if: ${{ github.event_name == 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: flakeyard/action-setup-nix@d9d2d2c4ab70b7829a12d6ad04bc9c1b350a9669 # v0.1.3
      - name: Rebuild the newest release
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          ARCH: ${{ matrix.arch }}
        run: nix run --no-update-lock-file .#check-release-rebuild -- "$IMAGE" "$ARCH"

  check:
    needs: [image, licenses, rebuild]
    # Dispatched runs post their final status on every outcome.
    if: ${{ !cancelled() || github.event_name == 'workflow_dispatch' }}
    uses: flakeyard/workflow-check/.github/workflows/check.yaml@be573996bc498dae2785bb0087e52cea34ae1b20 # v0.2.0
    permissions:
      actions: read # own job name and the jobs of the run
      contents: read # repository files through the contents API
      pull-requests: read # the title of the pull request
      statuses: write # commit statuses of dispatched runs
    with:
      needs: ${{ toJSON(needs) }}
      caller-may-skip: '["rebuild"]'
      # The job image checks flake.lock and runs nix flake check itself,
      # before the smoke tests.
      flake: ""
      renovate-presets: '["flakeyard/renovate-config"]'
