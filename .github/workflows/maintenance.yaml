# Weekly maintenance check, not required (FY-0026): the end of life of the
# nixpkgs branch. It depends on the date, so it never blocks pull requests.
name: maintenance

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  pending:
    name: Report pending
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write # commit status of a dispatched run
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          STATE: pending
          CONTEXT: maintenance
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh api --silent -X POST "repos/$REPO/statuses/$SHA"
          -f state="$STATE" -f context="$CONTEXT" -f target_url="$RUN_URL"
          -f description="GitHub Actions run"

  eol:
    name: End of life of the nixpkgs branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: flakeyard/action-setup-nix@0a6360ba8fee1bb4da86d28ec4a1d204aa047be3 # v0.1.4
      - name: End of life of the nixpkgs branch
        shell: bash
        run: nix run --no-update-lock-file .#check-eol -- nixpkgs-eol

  # Scheduled runs need no result job: a failed check fails the run.
  result:
    name: maintenance
    needs: [pending, eol]
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write # commit status of a dispatched run
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          STATE: ${{ needs.eol.result == 'success' && 'success' || 'failure' }}
          CONTEXT: maintenance
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh api --silent -X POST "repos/$REPO/statuses/$SHA"
          -f state="$STATE" -f context="$CONTEXT" -f target_url="$RUN_URL"
          -f description="GitHub Actions run"
