name: Attest once
description: >-
  Attests a digest of the image unless an attestation of the release workflow
  with the predicate type already verifies for it (FY-0027).
inputs:
  image:
    description: Registry repository of the image.
    required: true
  digest:
    description: Digest to attest.
    required: true
  predicate-type:
    description: Predicate type to look for; empty for provenance.
    default: ""
  sbom-path:
    description: >-
      SBOM to attest instead of provenance; predicate-type must be its type.
    default: ""
runs:
  using: composite
  steps:
    - id: attested
      name: Attested before
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ inputs.digest }}
        PREDICATE: ${{ inputs.predicate-type }}
      run: '"$GITHUB_ACTION_PATH/attested.sh"'
    - if: steps.attested.outputs.attested != 'true'
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ inputs.digest }}
        sbom-path: ${{ inputs.sbom-path }}
        push-to-registry: true
